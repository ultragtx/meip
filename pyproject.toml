[project]
name = "meip"
version = "0.1.0"
description = "MEIP: a Magnetic-Moment-Supervised E(3)-Equivariant Interatomic Potential for Transition-Metal Systems"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "BSD-3-Clause" }
dependencies = [
    "ase>=3.23.0",
    "cython>=3",
    "e3nn>=0.5.1",
    "jsonlines>=4",
    "numpy>=1.26",
    "nvidia-ml-py3>=7.352.0",
    "pymatgen>=2024.9.10",
    "torch>=2.4.1",
    "typing-extensions>=4.12",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=4"]
logging = ["wandb>=0.17.2"]

[tool.setuptools.packages]
find = { include = ["meip*"], exclude = ["tests", "tests*"] }

[tool.setuptools.package-data]
"meip" = ["*.json", "py.typed"]
"meip.graph.fast_converter_libraries" = ["*"]

[build-system]
requires = ["Cython", "numpy>=2.0.0", "setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
output-format = "concise"
